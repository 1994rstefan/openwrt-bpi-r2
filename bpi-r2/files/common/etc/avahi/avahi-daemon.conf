# OS298 firmware safe default; Ansible owns activation.
[server]
use-ipv4=yes
use-ipv6=yes
allow-interfaces=lo
allow-point-to-point=no
disallow-other-stacks=yes
cache-entries-max=1024
ratelimit-interval-usec=1000000
ratelimit-burst=100

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=yes
disable-user-service-publishing=yes
publish-addresses=no
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-resolv-conf-dns-servers=no

[reflector]
enable-reflector=no
reflect-ipv=no

[rlimits]
rlimit-core=0
rlimit-nofile=128
